project:
  name: clasificacion_wine_quality_didactica
  team_alias: equipo-01
  decision_supported: seleccionar con validacion y comprobar una vez en test
  users_affected: equipo docente; ninguna decision comercial
data:
  source: semana1/data/raw/WineQT.csv
  contains_personal_data: false
  rows: 1143
  target: quality multiclase 3-8
  target_encoding: quality_class = quality - 3
  split:
    train_rows: 799
    validation_rows: 172
    test_rows: 172
    random_state: 42
  limitations:
    - Clases extremas minoritarias; F1 macro bajo.
    - Procedencia y muestra no representan toda la produccion vinicola.
    - No autoriza decisiones comerciales.
