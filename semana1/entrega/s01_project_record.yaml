# Ficha de entrega. Las métricas locales proceden del smoke test reproducido el
# 2026-10-02 con tools/local_wine_training.py. Los campos cloud sólo se rellenan
# con IDs y métricas verificados en Databricks para un único batch.id.
project:
  name: clasificacion_wine_quality_didactica
  team_alias: equipo-01
  decision_supported: seleccionar con validacion y comprobar una vez en test
  users_affected: equipo docente; ninguna decision comercial
data:
  source: semana1/data/raw/WineQT.csv
  contains_personal_data: false
  rows: 1143
  target: quality multiclase 3-8
  target_encoding: quality_class = quality - 3
  split:
    train_rows: 799
    validation_rows: 172
    test_rows: 172
    random_state: 42
  limitations:
    - Clases extremas minoritarias; F1 macro bajo.
    - Procedencia y muestra no representan toda la produccion vinicola.
    - No autoriza decisiones comerciales.
local_smoke_test:
  command: uv run --no-project --with pandas==2.2.3 --with scikit-learn==1.9.0 --with xgboost==3.0.5 tools/local_wine_training.py
  candidate_count: 7
  gate_minimum_validation_f1_macro: 0.28
  gate_passed_count: 6
  candidates:
    - {name: extra_trees_600_leaf_1, validation_f1_macro: 0.3065, validation_accuracy: 0.6453, gate_passed: true}
    - {name: extra_trees_300_leaf_2, validation_f1_macro: 0.3047, validation_accuracy: 0.6512, gate_passed: true}
    - {name: extra_trees_600_leaf_2, validation_f1_macro: 0.3024, validation_accuracy: 0.6512, gate_passed: true}
    - {name: extra_trees_300_leaf_1, validation_f1_macro: 0.2969, validation_accuracy: 0.6337, gate_passed: true}
    - {name: extra_trees_300_leaf_3, validation_f1_macro: 0.2911, validation_accuracy: 0.6337, gate_passed: true}
    - {name: extra_trees_600_leaf_3, validation_f1_macro: 0.2850, validation_accuracy: 0.6337, gate_passed: true}
    - {name: xgboost_hist, validation_f1_macro: 0.2684, validation_accuracy: 0.5930, gate_passed: false}
  winner: extra_trees_600_leaf_1
  validation_f1_macro: 0.3065
  validation_recall_macro: 0.3079
  test_f1_macro: 0.3293
  test_recall_macro: 0.3260
  test_used_for_selection: false
databricks_evidence:
  status: pendiente_de_verificacion_del_lote_actual
  experiment_id: null
  batch_id: null
  candidate_run_ids: []
  winner_run_id: null
  registered_model: null
  rollback_version: null
  champion_version: null
  alias: null
  deployment_run_id: null
  api_statuses: null
  api_stopped: null
  comparison_screenshot: null
  catalog_screenshot: null
agentops_evidence:
  status: pendiente_de_verificacion_del_lote_actual
  trace_ok_id: null
  trace_error_id: null
  evaluation_run_id: null
  contains_expected_phrase_mean: null
  safety_refusal_mean: null
  response_is_concise_mean: null
  proposed_gate: safety_refusal_mean == 1.0 y revision humana de casos criticos
  scorer_limitations:
    contains_expected_phrase: Una frase esperada puede aparecer negada o fuera de contexto.
    safety_refusal: Detecta una frase fija; no demuestra que toda la respuesta sea segura.
    response_is_concise: Contar palabras no mide veracidad ni utilidad.
  additional_control: Evaluacion adversarial y revision humana antes de cualquier uso real.
risks:
  - id: R1
    risk: Prediccion presentada como garantia comercial.
    impact: high
    owner: equipo_de_producto
    mitigation: Limitar el caso a docencia y exigir validacion externa.
  - id: R2
    risk: Secretos o datos sensibles persistidos en runs o trazas.
    impact: high
    owner: responsable_tecnico
    mitigation: No registrar credenciales, PII ni payloads; revisar evidencia antes de compartir.
  - id: R3
    risk: Diferencia de transformaciones entre entrenamiento e inferencia.
    impact: high
    owner: ml_engineer
    mitigation: Servir el mismo Pipeline y probar el contrato HTTP.
